<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Framework Niuexa in sei gate per la due diligence di un fornitore AI</title>
  <desc id="desc">Percorso da scopo e responsabilità a dati, qualità, sicurezza, economics e uscita, con evidenza richiesta a ogni gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1A26"/><stop offset="0.55" stop-color="#14324A"/><stop offset="1" stop-color="#0E4E58"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#237DA6"/><stop offset="0.5" stop-color="#0E9C9A"/><stop offset="1" stop-color="#43AE68"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06121C" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="760" rx="0" fill="url(#bg)"/>
  <rect x="46" y="42" width="1108" height="676" rx="30" fill="none" stroke="#2B5A70" stroke-width="2"/>
  <image href="../../niuexalogo.png" x="72" y="64" width="180" height="50" preserveAspectRatio="xMinYMid meet"/>
  <text x="72" y="166" fill="#FFFFFF" font-family="Space Grotesk, Arial, sans-serif" font-size="40" font-weight="700">6 gate. 6 evidenze. 1 decisione.</text>
  <text x="72" y="207" fill="#BBD2DE" font-family="Hanken Grotesk, Arial, sans-serif" font-size="21">La demo apre la conversazione. Le prove autorizzano il go-live.</text>
  <rect x="72" y="238" width="1056" height="8" rx="4" fill="url(#accent)"/>

  <g filter="url(#shadow)" font-family="Hanken Grotesk, Arial, sans-serif">
    <g transform="translate(72 286)"><rect width="324" height="150" rx="22" fill="#FFFFFF"/><circle cx="42" cy="42" r="23" fill="#237DA6"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">1</text><text x="78" y="43" fill="#14324A" font-size="23" font-weight="700">Scopo e ruoli</text><text x="28" y="88" fill="#54697A" font-size="17">Uso previsto, limiti, owner</text><text x="28" y="117" fill="#0E7A78" font-size="16" font-weight="700">Evidenza: scheda del caso d’uso</text></g>
    <g transform="translate(438 286)"><rect width="324" height="150" rx="22" fill="#FFFFFF"/><circle cx="42" cy="42" r="23" fill="#1F64AE"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">2</text><text x="78" y="43" fill="#14324A" font-size="23" font-weight="700">Dati</text><text x="28" y="88" fill="#54697A" font-size="17">Flussi, retention, training</text><text x="28" y="117" fill="#0E7A78" font-size="16" font-weight="700">Evidenza: data flow + clausole</text></g>
    <g transform="translate(804 286)"><rect width="324" height="150" rx="22" fill="#FFFFFF"/><circle cx="42" cy="42" r="23" fill="#0E9C9A"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">3</text><text x="78" y="43" fill="#14324A" font-size="23" font-weight="700">Qualità</text><text x="28" y="88" fill="#54697A" font-size="17">Test set, errori, baseline</text><text x="28" y="117" fill="#0E7A78" font-size="16" font-weight="700">Evidenza: report comparabile</text></g>
    <g transform="translate(72 474)"><rect width="324" height="150" rx="22" fill="#FFFFFF"/><circle cx="42" cy="42" r="23" fill="#0E8A88"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">4</text><text x="78" y="43" fill="#14324A" font-size="23" font-weight="700">Sicurezza</text><text x="28" y="88" fill="#54697A" font-size="17">Accessi, log, incidenti</text><text x="28" y="117" fill="#0E7A78" font-size="16" font-weight="700">Evidenza: controlli verificati</text></g>
    <g transform="translate(438 474)"><rect width="324" height="150" rx="22" fill="#FFFFFF"/><circle cx="42" cy="42" r="23" fill="#2C8A4C"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">5</text><text x="78" y="43" fill="#14324A" font-size="23" font-weight="700">Economics</text><text x="28" y="88" fill="#54697A" font-size="17">TCO, volumi, supervisione</text><text x="28" y="117" fill="#2C7A45" font-size="16" font-weight="700">Evidenza: scenario costi reale</text></g>
    <g transform="translate(804 474)"><rect width="324" height="150" rx="22" fill="#FFFFFF"/><circle cx="42" cy="42" r="23" fill="#43AE68"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">6</text><text x="78" y="43" fill="#14324A" font-size="23" font-weight="700">Continuità e uscita</text><text x="28" y="88" fill="#54697A" font-size="17">Change, fallback, export</text><text x="28" y="117" fill="#2C7A45" font-size="16" font-weight="700">Evidenza: piano contrattuale</text></g>
  </g>
  <text x="600" y="682" text-anchor="middle" fill="#DDEBF1" font-family="JetBrains Mono, monospace" font-size="16">GO solo quando requisiti, prove e owner coincidono</text>
</svg>
