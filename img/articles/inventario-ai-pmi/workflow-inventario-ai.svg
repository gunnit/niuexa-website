<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Niuexa per l'inventario degli usi AI</title>
  <desc id="desc">Cinque passaggi: scoprire gli usi, descrivere il workflow, classificare il rischio, decidere lo stato e riesaminare i cambi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1A26"/><stop offset="1" stop-color="#14324A"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#237DA6"/><stop offset="0.5" stop-color="#0E9C9A"/><stop offset="1" stop-color="#43AE68"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06121C" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <rect x="42" y="42" width="1116" height="636" rx="26" fill="none" stroke="#237DA6" stroke-opacity="0.25"/>
  <text x="72" y="108" fill="#4FD1C5" font-family="Space Grotesk,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">INVENTARIO AI OPERATIVO</text>
  <text x="72" y="154" fill="#FFFFFF" font-family="Space Grotesk,Arial,sans-serif" font-size="34" font-weight="700">Dagli usi dispersi a decisioni governate</text>
  <text x="72" y="190" fill="#ADB5BD" font-family="Hanken Grotesk,Arial,sans-serif" font-size="20">Ogni fase produce un'evidenza e assegna una responsabilità.</text>
  <path d="M130 368 H1070" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <g font-family="Hanken Grotesk,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(62 250)"><rect width="200" height="250" rx="22" fill="#173D57" stroke="#237DA6"/><circle cx="100" cy="70" r="34" fill="#237DA6"/><text x="100" y="80" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">1</text><text x="100" y="132" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="700">SCOPRI</text><text x="100" y="170" text-anchor="middle" fill="#ADB5BD" font-size="17"><tspan x="100">Attività, tool,</tspan><tspan x="100" dy="24">utenti e frequenza</tspan></text><text x="100" y="226" text-anchor="middle" fill="#4FD1C5" font-size="15">OUTPUT: BASELINE</text></g>
    <g transform="translate(281 250)"><rect width="200" height="250" rx="22" fill="#173D57" stroke="#0E9C9A"/><circle cx="100" cy="70" r="34" fill="#0E9C9A"/><text x="100" y="80" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">2</text><text x="100" y="132" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="700">DESCRIVI</text><text x="100" y="170" text-anchor="middle" fill="#ADB5BD" font-size="17"><tspan x="100">Dati, output,</tspan><tspan x="100" dy="24">azione e owner</tspan></text><text x="100" y="226" text-anchor="middle" fill="#4FD1C5" font-size="15">OUTPUT: SCHEDA</text></g>
    <g transform="translate(500 250)"><rect width="200" height="250" rx="22" fill="#173D57" stroke="#0E9C9A"/><circle cx="100" cy="70" r="34" fill="#0E9C9A"/><text x="100" y="80" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">3</text><text x="100" y="132" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="700">CLASSIFICA</text><text x="100" y="170" text-anchor="middle" fill="#ADB5BD" font-size="17"><tspan x="100">Dati, autonomia,</tspan><tspan x="100" dy="24">impatto, reversibilità</tspan></text><text x="100" y="226" text-anchor="middle" fill="#4FD1C5" font-size="15">OUTPUT: PRIORITÀ</text></g>
    <g transform="translate(719 250)"><rect width="200" height="250" rx="22" fill="#173D57" stroke="#43AE68"/><circle cx="100" cy="70" r="34" fill="#2C7A45"/><text x="100" y="80" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">4</text><text x="100" y="132" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="700">DECIDI</text><text x="100" y="170" text-anchor="middle" fill="#ADB5BD" font-size="17"><tspan x="100">Approva, correggi,</tspan><tspan x="100" dy="24">pilota o sospendi</tspan></text><text x="100" y="226" text-anchor="middle" fill="#5CC98A" font-size="15">OUTPUT: STATO</text></g>
    <g transform="translate(938 250)"><rect width="200" height="250" rx="22" fill="#173D57" stroke="#43AE68"/><circle cx="100" cy="70" r="34" fill="#2C7A45"/><text x="100" y="80" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">5</text><text x="100" y="132" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="700">RIESAMINA</text><text x="100" y="170" text-anchor="middle" fill="#ADB5BD" font-size="17"><tspan x="100">Cambi, incidenti</tspan><tspan x="100" dy="24">e scadenze</tspan></text><text x="100" y="226" text-anchor="middle" fill="#5CC98A" font-size="15">OUTPUT: CICLO</text></g>
  </g>
  <rect x="72" y="560" width="1056" height="78" rx="18" fill="#0E9C9A" fill-opacity="0.13" stroke="#4FD1C5" stroke-opacity="0.35"/>
  <text x="600" y="594" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk,Arial,sans-serif" font-size="21" font-weight="700">REGOLA DI QUALITÀ</text>
  <text x="600" y="622" text-anchor="middle" fill="#ADB5BD" font-family="Hanken Grotesk,Arial,sans-serif" font-size="18">Nessuna riga senza owner, stato, controllo e prossima revisione.</text>
</svg>
