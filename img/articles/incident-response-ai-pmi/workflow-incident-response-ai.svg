<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo Niuexa di incident response per sistemi AI</title>
  <desc id="desc">Sette fasi operative: rilevare, classificare, contenere, preservare, ripristinare, comunicare e imparare.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1A26"/><stop offset="0.58" stop-color="#14324A"/><stop offset="1" stop-color="#0E4E58"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#237DA6"/><stop offset="0.5" stop-color="#0E9C9A"/><stop offset="1" stop-color="#43AE68"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#06121C" flood-opacity="0.34"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="46" y="42" width="1108" height="676" rx="30" fill="none" stroke="#2B5A70" stroke-width="2"/>
  <rect x="70" y="58" width="214" height="68" rx="18" fill="#FFFFFF"/>
  <image href="../../niuexalogo.png" x="88" y="69" width="178" height="49" preserveAspectRatio="xMinYMid meet"/>
  <text x="70" y="180" fill="#FFFFFF" font-family="Space Grotesk, Arial, sans-serif" font-size="40" font-weight="700">Un incidente AI non finisce con lo stop</text>
  <text x="70" y="220" fill="#BBD2DE" font-family="Hanken Grotesk, Arial, sans-serif" font-size="21">Contieni il danno, conserva le evidenze e riapri solo con criteri verificati.</text>
  <rect x="70" y="250" width="1060" height="8" rx="4" fill="url(#line)"/>
  <path d="M145 385 H1050" stroke="#7AB7C8" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <g filter="url(#shadow)" font-family="Hanken Grotesk, Arial, sans-serif">
    <g transform="translate(82 315)"><circle cx="63" cy="70" r="54" fill="#237DA6"/><text x="63" y="78" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">1</text><text x="63" y="158" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">Rileva</text><text x="63" y="184" text-anchor="middle" fill="#AFC8D5" font-size="15">Segnale + alert</text></g>
    <g transform="translate(232 315)"><circle cx="63" cy="70" r="54" fill="#1F64AE"/><text x="63" y="78" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">2</text><text x="63" y="158" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">Classifica</text><text x="63" y="184" text-anchor="middle" fill="#AFC8D5" font-size="15">Impatto + scala</text></g>
    <g transform="translate(382 315)"><circle cx="63" cy="70" r="54" fill="#0E9C9A"/><text x="63" y="78" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">3</text><text x="63" y="158" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">Contieni</text><text x="63" y="184" text-anchor="middle" fill="#AFC8D5" font-size="15">Stop + revoca</text></g>
    <g transform="translate(532 315)"><circle cx="63" cy="70" r="54" fill="#0E8A88"/><text x="63" y="78" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">4</text><text x="63" y="158" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">Preserva</text><text x="63" y="184" text-anchor="middle" fill="#AFC8D5" font-size="15">Log + versioni</text></g>
    <g transform="translate(682 315)"><circle cx="63" cy="70" r="54" fill="#2C8A4C"/><text x="63" y="78" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">5</text><text x="63" y="158" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">Ripristina</text><text x="63" y="184" text-anchor="middle" fill="#AFC8D5" font-size="15">Fallback + test</text></g>
    <g transform="translate(832 315)"><circle cx="63" cy="70" r="54" fill="#43AE68"/><text x="63" y="78" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">6</text><text x="63" y="158" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">Comunica</text><text x="63" y="184" text-anchor="middle" fill="#AFC8D5" font-size="15">Owner + obblighi</text></g>
    <g transform="translate(982 315)"><circle cx="63" cy="70" r="54" fill="#2C7A45"/><text x="63" y="78" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">7</text><text x="63" y="158" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">Impara</text><text x="63" y="184" text-anchor="middle" fill="#AFC8D5" font-size="15">Fix + ownership</text></g>
  </g>
  <rect x="112" y="570" width="976" height="92" rx="22" fill="#FFFFFF" opacity="0.96"/>
  <text x="600" y="608" text-anchor="middle" fill="#14324A" font-family="Space Grotesk, Arial, sans-serif" font-size="23" font-weight="700">Gate di riapertura</text>
  <text x="600" y="640" text-anchor="middle" fill="#54697A" font-family="Hanken Grotesk, Arial, sans-serif" font-size="18">causa compresa • controllo verificato • owner nominato • monitoraggio attivo</text>
</svg>
