<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Matrice Niuexa di severità per incidenti AI</title>
  <desc id="desc">Quattro livelli da S1 a S4 basati su impatto, diffusione, reversibilità e dati coinvolti.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1A26"/><stop offset="1" stop-color="#14324A"/></linearGradient></defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <rect x="46" y="42" width="1108" height="596" rx="30" fill="none" stroke="#2B5A70" stroke-width="2"/>
  <rect x="70" y="58" width="214" height="68" rx="18" fill="#FFFFFF"/><image href="../../niuexalogo.png" x="88" y="69" width="178" height="49"/>
  <text x="70" y="178" fill="#FFFFFF" font-family="Space Grotesk, Arial, sans-serif" font-size="39" font-weight="700">Severità: decidere prima dell’incidente</text>
  <text x="70" y="216" fill="#BBD2DE" font-family="Hanken Grotesk, Arial, sans-serif" font-size="20">La priorità cresce con impatto, diffusione, irreversibilità e sensibilità dei dati.</text>
  <g font-family="Hanken Grotesk, Arial, sans-serif">
    <g transform="translate(70 265)"><rect width="245" height="270" rx="22" fill="#E9F4F8"/><rect width="245" height="62" rx="22" fill="#237DA6"/><rect y="40" width="245" height="22" fill="#237DA6"/><text x="24" y="41" fill="#FFFFFF" font-size="24" font-weight="700">S1 • Basso</text><text x="24" y="102" fill="#14324A" font-size="18" font-weight="700">Output imperfetto</text><text x="24" y="135" fill="#54697A" font-size="16">Nessuna azione esterna</text><text x="24" y="163" fill="#54697A" font-size="16">Dati non sensibili</text><text x="24" y="191" fill="#54697A" font-size="16">Errore reversibile</text><text x="24" y="234" fill="#0E7A78" font-size="16" font-weight="700">Correggi e registra</text></g>
    <g transform="translate(340 265)"><rect width="245" height="270" rx="22" fill="#E8F5F4"/><rect width="245" height="62" rx="22" fill="#0E9C9A"/><rect y="40" width="245" height="22" fill="#0E9C9A"/><text x="24" y="41" fill="#FFFFFF" font-size="24" font-weight="700">S2 • Medio</text><text x="24" y="102" fill="#14324A" font-size="18" font-weight="700">Processo degradato</text><text x="24" y="135" fill="#54697A" font-size="16">Pochi casi coinvolti</text><text x="24" y="163" fill="#54697A" font-size="16">Impatto contenibile</text><text x="24" y="191" fill="#54697A" font-size="16">Fallback disponibile</text><text x="24" y="234" fill="#0E7A78" font-size="16" font-weight="700">Contieni e analizza</text></g>
    <g transform="translate(610 265)"><rect width="245" height="270" rx="22" fill="#EFF7EA"/><rect width="245" height="62" rx="22" fill="#2C8A4C"/><rect y="40" width="245" height="22" fill="#2C8A4C"/><text x="24" y="41" fill="#FFFFFF" font-size="24" font-weight="700">S3 • Alto</text><text x="24" y="102" fill="#14324A" font-size="18" font-weight="700">Clienti o denaro</text><text x="24" y="135" fill="#54697A" font-size="16">Azioni già eseguite</text><text x="24" y="163" fill="#54697A" font-size="16">Dati riservati possibili</text><text x="24" y="191" fill="#54697A" font-size="16">Più team coinvolti</text><text x="24" y="234" fill="#2C7A45" font-size="16" font-weight="700">Stop e team incidenti</text></g>
    <g transform="translate(880 265)"><rect width="245" height="270" rx="22" fill="#FFF1ED"/><rect width="245" height="62" rx="22" fill="#B44A3A"/><rect y="40" width="245" height="22" fill="#B44A3A"/><text x="24" y="41" fill="#FFFFFF" font-size="24" font-weight="700">S4 • Critico</text><text x="24" y="102" fill="#14324A" font-size="18" font-weight="700">Diritti o sicurezza</text><text x="24" y="135" fill="#54697A" font-size="16">Impatto esteso</text><text x="24" y="163" fill="#54697A" font-size="16">Danno non reversibile</text><text x="24" y="191" fill="#54697A" font-size="16">Obblighi possibili</text><text x="24" y="234" fill="#923526" font-size="16" font-weight="700">Crisis lead + legale</text></g>
  </g>
  <text x="600" y="591" text-anchor="middle" fill="#DDEBF1" font-family="JetBrains Mono, monospace" font-size="16">La matrice è una guida operativa: gli obblighi di notifica richiedono una valutazione specifica.</text>
</svg>
