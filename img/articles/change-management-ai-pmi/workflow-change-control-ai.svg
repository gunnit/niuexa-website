<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Workflow di change control AI in sei gate</title><desc id="desc">Dalla richiesta alla chiusura con evidenze e rollback</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#237DA6"/><stop offset="0.5" stop-color="#0E9C9A"/><stop offset="1" stop-color="#43AE68"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#237DA6"/></marker></defs>
  <rect width="1200" height="760" fill="#F1F5F8"/><rect x="36" y="36" width="1128" height="688" rx="28" fill="#FFFFFF" stroke="#D8E3EA" stroke-width="2"/>
  <image href="../../niuexalogo.png" x="72" y="62" width="166" height="46" preserveAspectRatio="xMidYMid meet"/>
  <text x="72" y="154" font-family="Space Grotesk,Arial,sans-serif" font-size="34" font-weight="700" fill="#14324A">Change control AI: sei gate, una traccia unica</text>
  <text x="72" y="192" font-family="Hanken Grotesk,Arial,sans-serif" font-size="20" fill="#54697A">Ogni passaggio produce un’evidenza prima che la modifica avanzi</text>
  <path d="M220 320 H390 M550 320 H720 M880 320 H1020" stroke="#237DA6" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <path d="M1020 430 H880 M720 430 H550 M390 430 H220" stroke="#237DA6" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <path d="M1040 350 V400" stroke="#237DA6" stroke-width="5" fill="none" marker-end="url(#a)"/>
  <g font-family="Space Grotesk,Arial,sans-serif" text-anchor="middle">
    <circle cx="150" cy="320" r="72" fill="#E8F4F9" stroke="#237DA6" stroke-width="4"/><text x="150" y="310" font-size="18" font-weight="700" fill="#1F64AE">1 · RICHIESTA</text><text x="150" y="340" font-family="Hanken Grotesk,Arial,sans-serif" font-size="17" fill="#14324A">Baseline</text>
    <circle cx="480" cy="320" r="72" fill="#E8F4F9" stroke="#237DA6" stroke-width="4"/><text x="480" y="310" font-size="18" font-weight="700" fill="#1F64AE">2 · IMPATTO</text><text x="480" y="340" font-family="Hanken Grotesk,Arial,sans-serif" font-size="17" fill="#14324A">Classe C1–C4</text>
    <circle cx="810" cy="320" r="72" fill="#E8F4F9" stroke="#237DA6" stroke-width="4"/><text x="810" y="310" font-size="18" font-weight="700" fill="#1F64AE">3 · TEST</text><text x="810" y="340" font-family="Hanken Grotesk,Arial,sans-serif" font-size="17" fill="#14324A">Criteri prima</text>
    <circle cx="1050" cy="510" r="72" fill="#EAF6EE" stroke="#43AE68" stroke-width="4"/><text x="1050" y="500" font-size="18" font-weight="700" fill="#2C7A45">4 · APPROVA</text><text x="1050" y="530" font-family="Hanken Grotesk,Arial,sans-serif" font-size="17" fill="#14324A">Versione esatta</text>
    <circle cx="720" cy="510" r="72" fill="#EAF6EE" stroke="#43AE68" stroke-width="4"/><text x="720" y="500" font-size="18" font-weight="700" fill="#2C7A45">5 · RILASCIA</text><text x="720" y="530" font-family="Hanken Grotesk,Arial,sans-serif" font-size="17" fill="#14324A">Traffico limitato</text>
    <circle cx="390" cy="510" r="72" fill="#EAF6EE" stroke="#43AE68" stroke-width="4"/><text x="390" y="500" font-size="18" font-weight="700" fill="#2C7A45">6 · OSSERVA</text><text x="390" y="530" font-family="Hanken Grotesk,Arial,sans-serif" font-size="17" fill="#14324A">Chiudi o rollback</text>
  </g>
  <rect x="100" y="640" width="1000" height="50" rx="25" fill="url(#g)"/><text x="600" y="672" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">OWNER + VERSIONE + EVIDENZE + CRITERIO DI ROLLBACK</text>
</svg>
