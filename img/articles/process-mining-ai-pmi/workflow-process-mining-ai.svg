<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Workflow Niuexa per il process mining prima di un progetto AI</title>
<desc id="desc">Cinque passaggi: perimetro, eventi, mappa reale, diagnosi e decisione del pilota AI.</desc>
<rect width="1200" height="720" fill="#0A1A26"/>
<rect x="42" y="42" width="1116" height="636" rx="32" fill="#102C40" stroke="#237DA6" stroke-width="2"/>
<image href="data:image/png;base64," x="76" y="70" width="216" height="60" preserveAspectRatio="xMidYMid meet"/>
<text x="76" y="182" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="42" font-weight="700">Dalla traccia operativa alla decisione AI</text>
<text x="76" y="224" fill="#ADB5BD" font-family="Arial, sans-serif" font-size="24">Ogni fase produce un’evidenza verificabile per il business case.</text>
<g font-family="Arial, sans-serif">
  <g transform="translate(76 292)"><rect width="192" height="178" rx="22" fill="#14324A" stroke="#237DA6" stroke-width="3"/><circle cx="42" cy="42" r="23" fill="#237DA6"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">1</text><text x="22" y="92" fill="#FFFFFF" font-size="24" font-weight="700">Perimetro</text><text x="22" y="126" fill="#ADB5BD" font-size="18">Caso, inizio, fine,</text><text x="22" y="152" fill="#ADB5BD" font-size="18">owner e domanda.</text></g>
  <path d="M276 381 H302" stroke="#4FD1C5" stroke-width="6" stroke-linecap="round"/><path d="M294 370 L306 381 L294 392" fill="none" stroke="#4FD1C5" stroke-width="5"/>
  <g transform="translate(310 292)"><rect width="192" height="178" rx="22" fill="#14324A" stroke="#0E9C9A" stroke-width="3"/><circle cx="42" cy="42" r="23" fill="#0E9C9A"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">2</text><text x="22" y="92" fill="#FFFFFF" font-size="24" font-weight="700">Eventi</text><text x="22" y="126" fill="#ADB5BD" font-size="18">ID caso, attività,</text><text x="22" y="152" fill="#ADB5BD" font-size="18">tempo e attributi.</text></g>
  <path d="M510 381 H536" stroke="#4FD1C5" stroke-width="6" stroke-linecap="round"/><path d="M528 370 L540 381 L528 392" fill="none" stroke="#4FD1C5" stroke-width="5"/>
  <g transform="translate(544 292)"><rect width="192" height="178" rx="22" fill="#14324A" stroke="#0E9C9A" stroke-width="3"/><circle cx="42" cy="42" r="23" fill="#0E9C9A"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">3</text><text x="22" y="92" fill="#FFFFFF" font-size="24" font-weight="700">Mappa reale</text><text x="22" y="126" fill="#ADB5BD" font-size="18">Percorso dominante</text><text x="22" y="152" fill="#ADB5BD" font-size="18">e varianti.</text></g>
  <path d="M744 381 H770" stroke="#4FD1C5" stroke-width="6" stroke-linecap="round"/><path d="M762 370 L774 381 L762 392" fill="none" stroke="#4FD1C5" stroke-width="5"/>
  <g transform="translate(778 292)"><rect width="192" height="178" rx="22" fill="#14324A" stroke="#43AE68" stroke-width="3"/><circle cx="42" cy="42" r="23" fill="#43AE68"/><text x="42" y="50" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">4</text><text x="22" y="92" fill="#FFFFFF" font-size="24" font-weight="700">Diagnosi</text><text x="22" y="126" fill="#ADB5BD" font-size="18">Attese, rilavorazioni</text><text x="22" y="152" fill="#ADB5BD" font-size="18">ed eccezioni.</text></g>
  <path d="M978 381 H1004" stroke="#4FD1C5" stroke-width="6" stroke-linecap="round"/><path d="M996 370 L1008 381 L996 392" fill="none" stroke="#4FD1C5" stroke-width="5"/>
  <g transform="translate(1012 292)"><rect width="112" height="178" rx="22" fill="#1D5634" stroke="#5CC98A" stroke-width="3"/><circle cx="38" cy="42" r="23" fill="#43AE68"/><text x="38" y="50" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">5</text><text x="18" y="92" fill="#FFFFFF" font-size="22" font-weight="700">Pilota</text><text x="18" y="126" fill="#D8F3E2" font-size="17">Baseline</text><text x="18" y="150" fill="#D8F3E2" font-size="17">e go/no-go.</text></g>
</g>
<rect x="76" y="528" width="1048" height="96" rx="20" fill="#F1F5F8"/>
<text x="102" y="570" fill="#14324A" font-family="Arial, sans-serif" font-size="24" font-weight="700">La domanda non è “dove inseriamo l’AI?”</text>
<text x="102" y="605" fill="#54697A" font-family="Arial, sans-serif" font-size="22">È: quale problema osservato richiede semplificazione, integrazione o interpretazione AI?</text>
</svg>