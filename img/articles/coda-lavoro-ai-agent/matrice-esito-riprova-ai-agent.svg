<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Matrice di decisione prima di riprovare un’azione dell’AI agent</title>
  <desc id="desc">Rifiuto certo consente un nuovo tentativo controllato, esito certo richiede verifica e chiusura, stato incerto richiede blocco e riconciliazione.</desc>
  <style>
    :root{--ink:#14324A;--blue:#237DA6;--teal:#0E9C9A;--green:#43AE68;--paper:#FFFFFF;--soft:#F1F5F8;--muted:#54697A;--warn:#C66A1B}
    .h{font:700 38px 'Space Grotesk',Arial,sans-serif;fill:var(--ink)}.s{font:600 18px 'Hanken Grotesk',Arial,sans-serif;fill:var(--muted)}.k{font:700 25px 'Space Grotesk',Arial,sans-serif}.b{font:500 19px 'Hanken Grotesk',Arial,sans-serif;fill:var(--ink)}.tag{font:700 17px 'JetBrains Mono',monospace}
  </style>
  <rect width="1200" height="720" rx="28" fill="var(--soft)"/>
  <text x="70" y="78" class="h">Prima del retry: riconosci lo stato</text>
  <text x="70" y="112" class="s">La risposta illeggibile non dimostra né fallimento né successo</text>
  <g transform="translate(70 175)"><rect width="330" height="400" rx="24" fill="var(--paper)" stroke="var(--blue)" stroke-width="4"/><rect width="330" height="74" rx="20" fill="var(--blue)"/><text x="24" y="47" class="k" fill="var(--paper)">RIFIUTO CERTO</text><text x="24" y="118" class="tag" fill="var(--blue)">NON ACCETTATO</text><text x="24" y="166" class="b">L’azione è fallita prima</text><text x="24" y="196" class="b">dell’accettazione.</text><path d="M38 246 h254" stroke="var(--soft)" stroke-width="3"/><text x="24" y="290" class="b">Correggi la causa.</text><text x="24" y="324" class="b">Applica backoff e limiti.</text><text x="24" y="358" class="b">Riprova secondo policy.</text></g>
  <g transform="translate(435 175)"><rect width="330" height="400" rx="24" fill="var(--paper)" stroke="var(--green)" stroke-width="4"/><rect width="330" height="74" rx="20" fill="var(--green)"/><text x="24" y="47" class="k" fill="var(--paper)">ESITO CERTO</text><text x="24" y="118" class="tag" fill="var(--green)">ACCETTATO / LETTO</text><text x="24" y="166" class="b">Il sistema destinatario</text><text x="24" y="196" class="b">conferma lo stato.</text><path d="M38 246 h254" stroke="var(--soft)" stroke-width="3"/><text x="24" y="290" class="b">Non ripetere l’azione.</text><text x="24" y="324" class="b">Conserva la prova.</text><text x="24" y="358" class="b">Chiudi o assegna il seguito.</text></g>
  <g transform="translate(800 175)"><rect width="330" height="400" rx="24" fill="var(--paper)" stroke="var(--warn)" stroke-width="4"/><rect width="330" height="74" rx="20" fill="var(--warn)"/><text x="24" y="47" class="k" fill="var(--paper)">STATO INCERTO</text><text x="24" y="118" class="tag" fill="var(--warn)">NESSUNA PROVA</text><text x="24" y="166" class="b">Timeout o risposta ambigua:</text><text x="24" y="196" class="b">l’effetto può esistere.</text><path d="M38 246 h254" stroke="var(--soft)" stroke-width="3"/><text x="24" y="290" class="b">Blocca il retry.</text><text x="24" y="324" class="b">Cerca per chiave stabile.</text><text x="24" y="358" class="b">Riconcilia o passa a un owner.</text></g>
  <rect x="190" y="620" width="820" height="58" rx="29" fill="var(--ink)"/>
  <text x="600" y="657" text-anchor="middle" class="s" fill="var(--paper)">Regola: nessun nuovo effetto esterno senza uno stato precedente deterministico</text>
</svg>
