name: Deploy to GitHub Pages and Cloudflare

# Cloudflare Workers serves niuexa.ai (through a route set in the Cloudflare
# dashboard; see wrangler.jsonc).
# GitHub Pages still receives the same bundle until it is retired. Check a deploy
# with node build/check-hosting.mjs https://niuexa.ai.
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Production deploys queue one at a time; a pull request keeps only its latest run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER: wrangler@4.142.0

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the Pages site; the old top-level grant covered this.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The generated HTML is committed, so the site never depends on this
      # step succeeding. It only catches a page that drifted from its source.
      - name: Verify generated articles match their content sources
        run: node build/build.mjs --check
      - name: Run the static content checks
        run: python3 -m unittest discover -s tests
      # Package only public files; never upload the working tree. Two of these
      # tests rebuild _site, so the files run one at a time.
      - name: Test event transport, metadata and packaging (no live submissions)
        run: node --test --test-concurrency=1 tests/event-registration.test.mjs tests/event-package.test.mjs tests/event-seo.test.mjs tests/cloudflare-package.test.mjs
      - name: Package public site
        run: node build/package-pages.mjs
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the allowlisted public artifact. Pages must use the workflow source.
          path: '_site'

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Same bundle on Cloudflare Workers static assets: a live deploy from master,
  # a preview URL for each pull request. Skipped until the secrets exist.
  cloudflare:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package the Cloudflare bundle
        run: node build/package-pages.mjs && node build/package-cloudflare.mjs
      - name: Serve the bundle locally and check every route
        run: |
          npx --yes "$WRANGLER" dev --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          node build/check-hosting.mjs http://127.0.0.1:8787 || { cat wrangler-dev.log; exit 1; }
      - name: Check for Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the Cloudflare upload."
          fi
      # Only master reaches production, like the github-pages environment's branch
      # policy: a manual run on another branch must not replace the live site.
      - name: Deploy to Cloudflare
        if: steps.credentials.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" deploy --message "${GITHUB_SHA::7}"
      - name: Upload a preview version
        if: steps.credentials.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" versions upload --preview-alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER ${GITHUB_SHA::7}" | tee upload.log
          { echo "### Cloudflare preview"; grep -oE 'https://[^ ]+\.workers\.dev' upload.log | sort -u; } >> "$GITHUB_STEP_SUMMARY"

  # Tell IndexNow (Bing, Copilot, ChatGPT search) which pages this push changed.
  indexnow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
        run: node build/package-pages.mjs && node build/indexnow.mjs "$BEFORE" "$GITHUB_SHA"
