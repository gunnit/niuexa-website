name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The generated HTML is committed, so the site never depends on this
      # step succeeding. It only catches a page that drifted from its source.
      - name: Verify generated articles match their content sources
        run: node build/build.mjs --check
      - name: Run the static content checks
        run: python3 -m unittest discover -s tests
      # upload-pages-artifact excludes only .git and .github and takes no
      # exclude input, so anything else at the root ships to the live site.
      # Strip local tooling and content sources before the checkout is packaged.
      - name: Remove build tooling from the Pages artifact
        run: rm -rf .claude build content templates tests
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository since it's a static site
          path: '.'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4